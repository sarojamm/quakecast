  <nav class="bg-gray-200 border border-gray-300 rounded-t-xl px-6 py-3">
    <div class="">
      <span class="text-2xl font-bold text-gray-800">QuakeCast Dashboard</span>
      <p class="text-sm text-gray-500">Monitoring seismic activity and risk trends</p>
    </div>
    <ul class="flex space-x-8 right">
      <li *ngFor="let tab of tabs" class="relative border-b-2">
        <a
          [routerLink]="tab.route"
          routerLinkActive="border-b-2 border-gray-900"
          [routerLinkActiveOptions]="{ exact: true }"
          class="px-2 py-1 text-gray-800 font-medium hover:text-blue-600"
        >
          {{ tab.label }}
        </a>
      </li>
    </ul>
  </nav>
